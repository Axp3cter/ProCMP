name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-13 }
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      # Zip everywhere, holding the binary alone at the archive root. Aftman reads zip
      # only, and when no entry matches the tool name it installs the first one ending
      # with the platform's executable suffix, which is empty on Unix. A README beside
      # the binary would be installed as the tool.
      - name: Package
        shell: bash
        run: |
          name="pcmp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pcmp.exe" dist/
            (cd dist && 7z a "$name.zip" pcmp.exe > /dev/null && rm pcmp.exe)
            (cd dist && certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256")
          else
            cp "target/${{ matrix.target }}/release/pcmp" dist/
            (cd dist && zip -qj "$name.zip" pcmp && rm pcmp)
            (cd dist && shasum -a 256 "$name.zip" | cut -d' ' -f1 > "$name.zip.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          for file in *.sha256; do
            printf '%s  %s\n' "$(cat "$file")" "${file%.sha256}" >> SHA256SUMS
            rm "$file"
          done
          sort -k2 -o SHA256SUMS SHA256SUMS

      # Draft, because a release whose assets are still uploading is one someone can
      # download half of.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
