name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain action: `rust-toolchain.toml` pins the version, and rustup
      # installs it on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  reproducible:
    name: Reproducible output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      # A build tool whose output is not byte-stable has no way to prove it did not
      # break something. `pcmp verify` builds twice and compares, so this job fails on
      # any nondeterminism the code introduces.
      - name: Build a fixture twice and compare
        run: |
          mkdir -p /tmp/fixture/src
          cat > /tmp/fixture/src/init.luau <<'LUAU'
          --!strict
          local VERSION: string = _G.PCMP_VERSION
          if _G.DEBUG then print("stripped") end
          return { version = VERSION }
          LUAU
          cat > /tmp/fixture/pcmp.luau <<'LUAU'
          return {
            vars = { name = "fixture", version = pcmp.env("VERSION") },
            profiles = {
              release = {
                entry = "src/init.luau",
                output = "dist/{name}.luau",
                define = { DEBUG = false },
                darklua = {
                  generator = "dense",
                  rules = {
                    "compute_expression",
                    "remove_unused_if_branch",
                    "remove_types",
                    "remove_comments",
                    "rename_variables",
                  },
                },
              },
            },
          }
          LUAU
          cd /tmp/fixture
          pcmp="$GITHUB_WORKSPACE/target/release/pcmp"
          "$pcmp" check --strict --env VERSION=v1.0.0
          "$pcmp" verify --env VERSION=v1.0.0

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
