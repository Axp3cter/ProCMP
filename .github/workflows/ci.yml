name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  reproducible:
    name: Reproducible output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Build a fixture twice and compare
        run: |
          mkdir -p /tmp/fixture/src
          cat > /tmp/fixture/src/init.luau <<'LUAU'
          --!strict
          local VERSION: string = PCMP_VERSION
          if DEBUG then print("stripped") end
          return { version = VERSION }
          LUAU
          cat > /tmp/fixture/pcmp.json5 <<'JSON5'
          {
            vars: { name: "fixture" },
            profiles: {
              release: {
                entry: "src/init.luau",
                output: "dist/{name}.luau",
                define: { DEBUG: false },
                darklua: {
                  generator: "dense",
                  rules: [
                    "compute_expression",
                    "remove_unused_if_branch",
                    "remove_types",
                    "remove_comments",
                    "rename_variables",
                  ],
                },
              },
            },
          }
          JSON5
          cd /tmp/fixture
          pcmp="$GITHUB_WORKSPACE/target/release/pcmp"
          "$pcmp" check --strict --var version=v1.0.0
          "$pcmp" verify --var version=v1.0.0

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A prebuilt binary rather than `cargo install`. Building cargo-audit from source
      # resolves its dependencies to their latest versions, whose MSRV moves ahead of
      # the toolchain this repository pins, and the build fails on a dependency nobody
      # here chose.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
