[package]
name         = "procmp"
description  = "Multi-target build composition for Luau projects"
version      = "4.0.0"
edition      = "2024"
rust-version = "1.90"
license      = "MIT"
repository   = "https://github.com/Proton-Utilities/ProCMP"
keywords     = ["luau", "darklua", "bundler", "roblox", "build"]
categories   = ["command-line-utilities", "development-tools::build-utils"]
exclude      = ["docs/", ".github/", ".gitbook.yaml", "rust-toolchain.toml", "rustfmt.toml"]

[[bin]]
name = "pcmp"
path = "src/main.rs"

[dependencies]
blake3                = "1"
camino                = { version = "1", features = ["serde1"] }
clap                  = { version = "4", features = ["derive", "string", "wrap_help"] }
crossterm             = "0.29"
# Pinned exactly, and mirrored by `procmp::DARKLUA_VERSION`. Bump both. A darklua patch
# release can change emitted bytes, and the version is part of every cache key.
darklua               = "=0.19.0"
indexmap              = { version = "2", features = ["serde"] }
json5                 = "1"
mlua                  = { version = "0.11", features = ["luau", "vendored", "serialize"] }
notify                = "8"
notify-debouncer-full = "0.7"
rayon                 = "1"
schemars              = { version = "1", features = ["indexmap2"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = { version = "1", features = ["preserve_order"] }
thiserror             = "2"
toml                  = "1"
wax                   = "0.7"

[profile.release]
lto           = "thin"
strip         = true
codegen-units = 1

# `panic = "abort"` is absent on purpose: mlua unwinds across the C boundary.

[profile.dev.package."*"]
opt-level = 2
