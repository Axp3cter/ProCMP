[project]

site_name = "ProCMP"
site_description = "Bundle one Luau source tree into many build targets from a single manifest."
site_url = "https://proton-utilities.github.io/ProCMP/"
repo_url = "https://github.com/Proton-Utilities/ProCMP"
repo_name = "Proton-Utilities/ProCMP"
copyright = "MIT licensed"

docs_dir = "docs"
site_dir = "site"

# Explicit rather than derived from the directory, because the reading order is not the
# alphabetical one and `diagnostics.md` belongs last however long it is.
nav = [
  { "ProCMP" = "index.md" },
  { "Start" = [{ "Install" = "install.md" }, { "Your first build" = "first-build.md" }] },
  { "Reference" = [{ "Manifest" = "manifest.md" }, { "darklua" = "darklua.md" }, { "CLI" = "cli.md" }, { "Diagnostics" = "diagnostics.md" }] },
]

# `diagnostics.md` is generated, and the rest of the documentation links into it by anchor.
# Checking anchors is what stops a renamed code from leaving a dead link behind, so
# `zensical build --strict` is the same guard for prose that `cargo clippy` is for code.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/layers"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Proton-Utilities/ProCMP"
name = "ProCMP on GitHub"
